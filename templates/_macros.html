{% macro marca(tamanho=34) %}
<svg width="{{ tamanho }}" height="{{ tamanho }}" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
  <rect width="40" height="40" rx="8" fill="#214A3F"/>
  <path d="M27.5 13.5a10 10 0 1 0 1.2 11.2" fill="none" stroke="#D8C29E" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M21 20h8v8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{% endmacro %}

{% macro icone(nome) %}
<svg class="icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if nome == 'auditoria' %}
    <path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M8 6H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-2"/><path d="M9 14l2 2 4-4"/>
  {% elif nome == 'escudo' %}
    <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>
  {% elif nome == 'fatura' %}
    <path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>
  {% elif nome == 'repasse' %}
    <path d="M5 9h13l-3-3"/><path d="M19 15H6l3 3"/>
  {% elif nome == 'local' %}
    <path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>
  {% elif nome == 'grafico' %}
    <path d="M4 20V11M10 20V4M16 20v-6M2 20h20"/>
  {% elif nome == 'ajuste' %}
    <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
  {% elif nome == 'cadeado' %}
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
  {% endif %}
</svg>
{% endmacro %}
